title: Homelab
views:
  - title: mi-server
    path: server
    icon: mdi:server
    type: masonry
    cards:
      - type: markdown
        content: |
          ## mi-server
          Debian · домашній сервер

      - type: entities
        title: Стан сервера
        show_header_toggle: false
        entities:
          - entity: binary_sensor.mi_server_status
            name: З'єднання
          - entity: sensor.mi_server_uptime
            name: Час роботи
          - entity: sensor.mi_server_temperature
            name: Температура
          - entity: sensor.mi_server_battery
            name: Батарея ноутбука

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.mi_server_cpu_usage
            name: CPU
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.mi_server_memory_usage
            name: RAM
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 75
              red: 90
          - type: gauge
            entity: sensor.mi_server_disk_usage
            name: Disk
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 75
              red: 90
          - type: gauge
            entity: sensor.mi_server_battery
            name: Battery
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50

      - type: history-graph
        title: Завантаження за 24 години
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.mi_server_cpu_usage
            name: CPU
          - entity: sensor.mi_server_memory_usage
            name: RAM

      - type: entities
        title: Пам'ять і диск
        show_header_toggle: false
        entities:
          - entity: sensor.mi_server_memory_used
            name: Використано RAM
          - entity: sensor.mi_server_memory_total
            name: Загальна RAM
          - entity: sensor.mi_server_disk_used
            name: Використано диска
          - entity: sensor.mi_server_disk_total
            name: Розмір диска
          - entity: sensor.mi_server_disk_read_rate
            name: Читання диска
          - entity: sensor.mi_server_disk_write_rate
            name: Запис диска

      - type: entities
        title: Мережа та навантаження
        show_header_toggle: false
        entities:
          - entity: sensor.mi_server_network_received
            name: Отримано
          - entity: sensor.mi_server_network_sent
            name: Надіслано
          - entity: sensor.mi_server_load_average_1_minute
            name: Load average · 1 хв
          - entity: sensor.mi_server_load_average_5_minutes
            name: Load average · 5 хв
          - entity: sensor.mi_server_load_average_15_minutes
            name: Load average · 15 хв
